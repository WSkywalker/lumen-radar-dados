name: Coletar concursos

on:
  schedule:
    # 06:17 e 18:17 no horário de Brasília (UTC-3)
    - cron: "17 9,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diário Oficial da União
        run: node coletor/dou.mjs
      - name: Salvar resultado
        run: |
          if git diff --quiet -- concursos.json; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "radar-coletor"
          git config user.email "radar-coletor@users.noreply.github.com"
          git add concursos.json
          git commit -m "Atualiza concursos ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
