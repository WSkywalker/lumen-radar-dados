name: Coletar concursos

on:
  schedule:
    # 06:17 e 18:17 no horário de Brasília (UTC-3)
    - cron: "17 9,21 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Dias para trás nos diários estaduais (padrão 3)"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diário Oficial da União
        run: node coletor/dou.mjs
      - name: Teste do Querido Diário
        continue-on-error: true
        run: node coletor/teste-querido.mjs
      - name: PNCP (bancas contratadas)
        continue-on-error: true
        run: node coletor/pncp.mjs
      - name: Instituto AOCP
        continue-on-error: true
        run: node coletor/aocp.mjs
      - name: Diário Oficial de São Paulo
        continue-on-error: true
        env:
          SP_DIAS: ${{ github.event.inputs.dias || '3' }}
        run: node coletor/sp.mjs
      - name: Diários estaduais (AP, AM, ES, GO, MT)
        continue-on-error: true
        env:
          DIARIOS_DIAS: ${{ github.event.inputs.dias || '3' }}
        run: node coletor/diarios-estaduais.mjs
      - name: Diários municipais de Sergipe (Município Online)
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund pdfjs-dist@4 >/dev/null
          node coletor/municipio-online.mjs
      - name: Consolidar fontes
        continue-on-error: true
        run: node coletor/consolidar.mjs
      - name: Salvar resultado
        run: |
          git config user.name "radar-coletor"
          git config user.email "radar-coletor@users.noreply.github.com"
          cp concursos.json /tmp/nosso.json
          cp status-querido.json /tmp/status-querido.json 2>/dev/null || true
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node ferramentas/mesclar.mjs /tmp/nosso.json concursos.json "dou:,pncp:,aocp:,sp:,es:,ap:,am:,go:,mt:,mo:"
            node coletor/consolidar.mjs || true
            cp /tmp/status-querido.json status-querido.json 2>/dev/null || true
            git add concursos.json status-querido.json 2>/dev/null || git add concursos.json
            if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
            git commit -q -m "Atualiza concursos ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
