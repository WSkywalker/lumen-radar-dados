name: Coletar concursos

on:
  schedule:
    # 06:17 e 18:17 no horário de Brasília (UTC-3)
    - cron: "17 9,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diário Oficial da União
        run: node coletor/dou.mjs
      - name: Teste do Querido Diário
        continue-on-error: true
        run: node coletor/teste-querido.mjs
      - name: PNCP (bancas contratadas)
        continue-on-error: true
        run: node coletor/pncp.mjs
      - name: Instituto AOCP
        continue-on-error: true
        run: node coletor/aocp.mjs
      - name: Consolidar fontes
        continue-on-error: true
        run: node coletor/consolidar.mjs
      - name: Salvar resultado
        run: |
          for f in concursos.json status-querido.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "radar-coletor"
          git config user.email "radar-coletor@users.noreply.github.com"
          git rm -q --cached status-pncp.json 2>/dev/null || true
          git commit -m "Atualiza concursos ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1
